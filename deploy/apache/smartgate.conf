<VirtualHost *:80>
    ServerName smartgate.localhost
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/smartGate/public

    <Directory /var/www/html/smartGate>
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/html/smartGate/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/smartgate-error.log
    CustomLog ${APACHE_LOG_DIR}/smartgate-access.log combined
</VirtualHost>
